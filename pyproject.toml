[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marinp"
version = "0.2.0"
description = "Marine biogenic ice-nucleating particle parameterizations (W15, M18), warm-temperature enhancement fitting and physics-constrained ML emulators"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joo Wan Cha" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]
keywords = ["ice nucleation", "INP", "sea spray aerosol", "cloud physics", "parameterization", "machine learning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.optional-dependencies]
scam = ["xarray>=2023.1", "netCDF4>=1.6"]
dev = ["pytest>=7", "xarray>=2023.1", "netCDF4>=1.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
