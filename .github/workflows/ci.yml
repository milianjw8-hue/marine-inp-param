name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: which gfortran || (sudo apt-get update && sudo apt-get install -y gfortran)
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: run synthetic demo end to end
        run: |
          python scripts/make_synthetic_data.py
          python scripts/run_demo.py --data data/synthetic_spectra.csv --features T_C log10_toc log10_chl
